
    spring.application.name=front-produtos
    # application.properties
server.port=8080
spring.application.name=produtos-frontend
# Configuração para servir arquivos estáticos
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
# Desabilitar funcionalidades não necessárias
spring.thymeleaf.enabled=false
# Configurações do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:8080/front-produtos
spring.datasource.username=eu
spring.datasource.password=Hrkanuqgyili6LL9P0wrDWCJXfEbl7rY
# Configurações JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Actuator config
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=Always
# Habilitar endpoints de métricas
management.endpoint.metrics.enabled=true
# Informações customizadas da aplicação
info.app.name=front-produtos
info.app.description=API REST com Spring Boot e PostgreSQL
info.app.version=1.0.0
info.app.author=gabriel
info.app.ambiente=produção